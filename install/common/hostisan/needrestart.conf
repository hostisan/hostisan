# Hostisan: needrestart must not restart the panel, hestia (hestia-nginx and
# php-fpm) or the web terminal. setup.sh installs this file as
# /etc/needrestart/conf.d/hostisan.conf and puts it back when it differs; put
# your own settings in another file there.
#
# On Ubuntu, needrestart runs from apt's DPkg::Post-Invoke hook as soon as dpkg
# is done. Run from the web terminal, the hestia postinst defers these restarts
# (restart-unit.sh) until dpkg and the update are done, so needrestart found
# hostisan.service still on the old binary and restarted it in line, which hung
# up every terminal session and the apt run in it (rc6 P1). The deferred
# restart, or the postinst's own restart outside the terminal, restarts them.
# needrestart lists them under "Service restarts being deferred" instead.
#
# needrestart reads this as Perl (a string eval of each conf.d/*.conf file); a
# unit name is "NAME.service", and the regex is anchored so that it matches
# only these three units.
$nrconf{override_rc}{qr(^(hostisan|hestia|hestia-web-terminal)\.service$)} = 0;
